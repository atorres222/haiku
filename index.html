<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Poppy Blooms</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page">
        <h1>A Poppy Blooms</h1>
        <p class="author">by Katsushika Hokusai</p>

        <figure class="art">
            <img src="img/Haiku_Image.jpg"
                 alt="A typewriter surrounded by crumpled paper with a bright red poppy blooming beside it">
        </figure>

        <div class="haiku">
            <p>I write, erase, rewrite</p>
            <p>Erase again, and then</p>
            <p class="third">A poppy blooms.</p>
        </div>
    </div>
</body>
</html>
